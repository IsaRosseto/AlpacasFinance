<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpacas Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F9; --surface:#FFFFFF; --surface-2:#F6F9FB; --hover:#EEF5FA;
  --ink:#0B1F2E; --muted:#59707F; --rule:#E0E8EE; --rule-strong:#A9BAC7;
  --brand:#0073B4; --brand-ink:#005F94; --on-brand:#FFFFFF; --brand-tint:#E3F1F9;
  --rail:#0B2F4D; --rail-2:#123E62; --rail-ink:#D5E5F1; --rail-mute:#8FB0C8;
  --s-and:#009EDD; --s-pen:#FEB914; --s-rej:#EE1C24; --s-ok:#00A54C;
  --bad-bg:#FDEEEE; --ok-bg:#E6F6ED; --info-bg:#E6F3FA; --warn-bg:#FFF6DC;
  --red:#EE1C24; --orange:#F78320; --yellow:#FEB914; --lime:#ACC32A; --green:#00A54C; --sky:#009EDD; --ice:#6DCFF6;
  --hh:64px; --railw:248px; --r:12px;
  --display:"Archivo","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --text:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1620; --surface:#0F2230; --surface-2:#122838; --hover:#173246;
    --ink:#E8F1F7; --muted:#9CB4C5; --rule:#22404F; --rule-strong:#47677A;
    --brand:#3AA6DE; --brand-ink:#79C6EF; --on-brand:#05202F; --brand-tint:#13354A;
    --rail:#071C2E; --rail-2:#0E2D47;
    --s-rej:#FF5A60; --bad-bg:#3F1A1D; --ok-bg:#0E3827; --info-bg:#13354A; --warn-bg:#3A2F10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1620; --surface:#0F2230; --surface-2:#122838; --hover:#173246;
  --ink:#E8F1F7; --muted:#9CB4C5; --rule:#22404F; --rule-strong:#47677A;
  --brand:#3AA6DE; --brand-ink:#79C6EF; --on-brand:#05202F; --brand-tint:#13354A;
  --rail:#071C2E; --rail-2:#0E2D47;
  --s-rej:#FF5A60; --bad-bg:#3F1A1D; --ok-bg:#0E3827; --info-bg:#13354A; --warn-bg:#3A2F10;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hh) + 16px)}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--rail);z-index:60}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand-ink)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mut{color:var(--muted)}
[hidden]{display:none!important}

/* ---------- Cabeçalho ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--hh);display:flex;align-items:stretch;background:var(--surface)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--red) 0 12.5%,var(--orange) 0 25%,var(--yellow) 0 37.5%,var(--lime) 0 50%,var(--green) 0 62.5%,var(--sky) 0 75%,#0073B4 0 87.5%,var(--ice) 0 100%)}
.brandbar{width:var(--railw);flex:none;background:var(--rail);display:flex;align-items:center;gap:6px;padding:0 10px 4px 10px;transition:width .2s}
.brandbar .icon-btn{color:var(--rail-ink)}
.brandbar .icon-btn:hover{background:var(--rail-2);color:#fff}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-family:var(--display);font-stretch:100%;font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.logo-badge{width:42px;height:42px;flex:none;background:var(--logo-dark) center/contain no-repeat}
body.collapsed .brandbar{width:76px}
body.collapsed .brand span{display:none}
.icon-btn{width:40px;height:40px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.icon-btn .dot{position:absolute;top:3px;right:1px;min-width:18px;height:18px;border-radius:9px;background:var(--orange);color:#2A1500;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.cmdk{margin:auto 0 auto 28px;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 14px;border:1px solid var(--rule);background:var(--surface-2);border-radius:10px;color:var(--muted);width:min(440px,36vw)}
.cmdk:hover{border-color:var(--brand)}
.cmdk svg{width:18px;height:18px;flex:none}
.cmdk span{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font:600 12px var(--text);border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--surface);color:var(--muted)}
.tools{margin-left:auto;display:flex;align-items:center;gap:6px;padding:0 18px 4px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--rail);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;margin-left:6px}

/* ---------- Estrutura ---------- */
.app{flex:1;display:flex;flex-direction:column;min-height:0}
.shell{flex:1;display:flex;align-items:flex-start;min-height:0}
nav#nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));width:var(--railw);flex:none;height:calc(100vh - var(--hh) - env(safe-area-inset-top,0px));background:var(--rail);padding:16px 0 20px;overflow-x:hidden;overflow-y:auto;transition:width .2s}
nav#nav .grp{color:var(--rail-mute);font-size:13px;font-weight:600;padding:18px 24px 6px;white-space:nowrap}
nav#nav .grp:first-child{padding-top:4px}
nav#nav a{position:relative;display:flex;align-items:center;gap:14px;padding:10px 24px;color:var(--rail-ink);text-decoration:none;font-weight:500;font-size:15.5px;white-space:nowrap;border-left:4px solid transparent}
nav#nav a svg{width:21px;height:21px;flex:none;opacity:.85}
nav#nav a:hover{background:var(--rail-2);color:#fff}
nav#nav a[aria-current="page"]{background:var(--rail-2);color:#fff;border-left-color:var(--sky);font-weight:600}
nav#nav a[aria-current="page"]::after{content:"";position:absolute;right:0;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:var(--bg);border-left-width:0}
nav#nav .badge{margin-left:auto;margin-right:10px;background:var(--orange);color:#2A1500;font-size:12px;font-weight:700;padding:0 7px;border-radius:9px;line-height:18px}
body.collapsed{--railw:76px}
body.collapsed nav#nav .lbl,body.collapsed nav#nav .badge,body.collapsed nav#nav .grp{display:none}
body.collapsed nav#nav a{justify-content:center;padding:12px 0}
main{flex:1;min-width:0;padding:36px clamp(18px,4vw,56px) 72px;max-width:1360px}
.scrim{position:fixed;inset:0;background:rgba(6,20,32,.55);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:70}
.scrim.on{opacity:1;visibility:visible}
footer{background:var(--surface);border-top:1px solid var(--rule);padding:10px 20px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- Títulos e blocos ---------- */
.pagehead{margin-bottom:28px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.pagehead h1{font-family:var(--display);font-stretch:114%;font-weight:800;font-size:clamp(28px,3.4vw,40px);line-height:1.05;letter-spacing:-.012em;margin:0 0 10px}
.pagehead p{margin:0;color:var(--muted);font-size:17px;max-width:62ch}
.sect{margin-top:36px}
.sect > h2,.sect-h h2{font-family:var(--display);font-stretch:110%;font-weight:700;font-size:20px;line-height:1.2;margin:0 0 4px}
.sect > p.sub,.sect-h p{margin:0 0 14px;color:var(--muted);font-size:15px}
.sect-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pn{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pn-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px 4px;flex-wrap:wrap}
.pn-h h2{margin:0;font-family:var(--display);font-stretch:108%;font-weight:700;font-size:18px;line-height:1.2}
.pn-h p{margin:2px 0 0;font-size:14.5px;color:var(--muted)}
.pn-b{padding:8px 22px 18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.grid2.wide{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}

/* ---------- Herói ---------- */
.hero{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:32px clamp(20px,3vw,40px) 34px;overflow:hidden}
.hero h1{font-family:var(--display);font-stretch:116%;font-weight:800;font-size:clamp(30px,4vw,46px);line-height:1.05;letter-spacing:-.015em;margin:0 0 10px;max-width:16ch}
.hero .lead{margin:0 0 4px;font-size:18px;color:var(--muted);max-width:52ch}
.hero .day{margin:0 0 24px;font-size:15px;color:var(--muted)}
.hero .find{max-width:640px;position:relative;z-index:1}
.hero{padding-right:calc(min(250px,26%) + 56px)}
.hero-mascot{position:absolute;right:clamp(16px,3vw,40px);bottom:0;top:18px;width:min(250px,26%);background:var(--logo) center bottom/contain no-repeat;pointer-events:none}
@media (max-width:980px){.hero-mascot{display:none}.hero{padding-right:clamp(20px,3vw,40px)}}
html[data-theme="dark"] .hero-mascot{background-image:var(--logo-dark)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero-mascot{background-image:var(--logo-dark)}}

/* ---------- Botões e campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 20px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{filter:brightness(.92)}
.btn.sec{background:var(--surface);color:var(--brand-ink);border-color:var(--rule-strong)}
.btn.sec:hover{background:var(--hover);filter:none;border-color:var(--brand)}
.btn.sm{height:34px;padding:0 14px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.btn svg{width:16px;height:16px}
.linkbtn{background:none;border:0;padding:0;color:var(--brand-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:left}
.find h2{font-size:18px;font-weight:600;margin:0 0 10px}
.find .hint{margin:-4px 0 10px;font-size:14.5px;color:var(--muted)}
.findrow{display:flex;gap:10px}
.field{flex:1;display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--rule-strong);border-radius:10px;padding:0 16px;height:48px}
.field:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint)}
.field svg{width:20px;height:20px;color:var(--muted);flex:none}
.field input{flex:1;border:0;background:transparent;height:100%;outline:0;min-width:0}
.field input::placeholder{color:var(--muted);opacity:.85}
.findrow .btn{height:48px;padding:0 26px}
.sel{position:relative;flex:1 1 170px;max-width:240px}
.sel select{width:100%;appearance:none;-webkit-appearance:none;background:var(--surface);border:1px solid var(--rule-strong);border-radius:10px;padding:0 34px 0 14px;height:42px;color:var(--muted)}
.sel select.has{color:var(--ink);border-color:var(--brand);font-weight:600}
.sel::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r)}
.filters .btn{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 14px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--rule-strong);background:var(--surface);border-radius:10px;font-size:14.5px;font-weight:500;color:var(--ink)}
.chip span{font-weight:700;color:var(--muted);font-size:13.5px}
.chip:hover{border-color:var(--brand);background:var(--hover)}
.chip.on{background:var(--rail);border-color:var(--rail);color:#fff}
.chip.on span{color:#BFE0F3}
.chips .linkbtn{margin-left:6px;font-size:14.5px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:0 0 12px}
.toolbar .sum{flex:1;min-width:200px;color:var(--muted);font-size:15px}
.toolbar .sum b{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:0 16px;height:36px;font-size:14.5px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--rule-strong)}
.seg button[aria-pressed="true"]{background:var(--rail);color:#fff;font-weight:600}

/* ---------- Situação e andamento ---------- */
.st{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-weight:500}
.st i{width:11px;height:11px;background:var(--c);flex:none}
.st.and{--c:var(--s-and)} .st.and i{clip-path:polygon(0 0,100% 50%,0 100%)}
.st.pen{--c:var(--s-pen)} .st.pen i{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.st.rej{--c:var(--s-rej)} .st.rej i{clip-path:polygon(0 0,100% 0,50% 100%)}
.st.ok{--c:var(--s-ok)} .st.ok i{clip-path:polygon(50% 0,100% 100%,0 100%)}
.k-and{--c:var(--s-and)} .k-pen{--c:var(--s-pen)} .k-rej{--c:var(--s-rej)} .k-ok{--c:var(--s-ok)}
.trk{display:inline-flex;align-items:center;gap:3px;height:14px}
.trk i{width:24px;height:7px;border-radius:2px;background:var(--rule)}
.trk i.d{background:var(--c);opacity:.5}
.trk i.c{background:var(--c);height:13px;border-radius:3px}
.trk i.b{background:var(--s-rej);height:13px;border-radius:3px}
.late{color:var(--s-rej);font-weight:600}

/* ---------- Tabela ---------- */
.tw{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px;font-size:15px}
th{text-align:left;font-weight:600;font-size:13.5px;color:var(--muted);padding:0;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--surface)}
th .th,th .plain{display:flex;align-items:center;gap:6px;width:100%;padding:14px 18px;text-align:left;background:none;border:0;font-weight:600;color:inherit}
th[aria-sort] .th{color:var(--ink)}
.car{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent}
th[aria-sort="ascending"] .car{border-bottom:5px solid currentColor}
th[aria-sort="descending"] .car{border-top:5px solid currentColor}
td{padding:16px 18px;border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tr[class*="k-"] td:first-child{box-shadow:inset 4px 0 0 var(--c)}
td .main{display:block;font-weight:600;color:var(--ink);background:none;border:0;padding:0;text-align:left;font-size:15px;line-height:1.35}
td button.main:hover{color:var(--brand-ink);text-decoration:underline;text-underline-offset:3px}
td .sub{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
td .sub2{display:flex;gap:12px;font-size:13.5px;color:var(--muted);margin-top:2px;flex-wrap:wrap}
td.num,th.num .th{text-align:right;justify-content:flex-end}
.empty{padding:44px 22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.star{width:34px;height:34px;border:0;background:none;display:grid;place-items:center;color:var(--rule-strong);border-radius:8px}
.star:hover{background:var(--surface-2);color:var(--orange)}
.star[aria-pressed="true"]{color:var(--orange)}
.star svg{width:20px;height:20px}

/* ---------- Esteira ---------- */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.stn{min-width:0;padding-bottom:8px}
.stn-h{display:flex;align-items:center;justify-content:space-between;gap:8px;width:calc(100% - 6px);height:76px;border:0;background:var(--c);color:#0B1F2E;padding:0 26px 0 30px;text-align:left;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%,18px 50%)}
.stn:first-child .stn-h{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%);padding-left:20px;border-radius:10px 0 0 10px}
.stn-h:hover{filter:brightness(.93)}
.stn-h .nm{font-weight:700;font-size:15px;line-height:1.2}
.stn-h .nm small{display:block;font-weight:500;font-size:13px;opacity:.85;margin-top:2px}
.stn-h .ct{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:32px;line-height:1}
.stn-v{padding:12px 16px 2px;font-size:14px;color:var(--muted)}
.tags{list-style:none;margin:0;padding:8px 10px 6px;display:grid;gap:8px}
.tag{width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--c);border-radius:8px;padding:9px 12px;display:block}
.tag:hover{background:var(--hover);border-color:var(--rule-strong);border-left-color:var(--c)}
.tag b{display:block;font-size:13.5px;color:var(--brand-ink)}
.tag .d{display:block;font-size:14px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag .fl{display:block;font-size:13px;font-weight:600;margin-top:3px;color:var(--s-rej)}
.more{padding:2px 16px 8px;font-size:14px}
.stn-empty{padding:6px 16px 10px;font-size:14px;color:var(--muted)}
.scrollx{overflow-x:auto}
.scrollx .board{min-width:960px}

/* ---------- Listas ---------- */
.rows{list-style:none;margin:0;padding:0}
.rows li{border-bottom:1px solid var(--rule)}
.rows li:last-child{border-bottom:0}
.row{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:none;border:0;padding:14px 6px;border-radius:8px}
.row:hover{background:var(--hover)}
.row[class*="k-"]{border-left:4px solid var(--c);padding-left:14px;border-radius:0 8px 8px 0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600}
.row .t span{display:block;font-size:14px;color:var(--muted)}
.row .when{font-weight:600;font-size:14.5px;text-align:right;white-space:nowrap}
.row .when small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.hint-empty{padding:18px 2px;color:var(--muted);font-size:15px}
.results{margin-top:20px}
.match{font-size:13.5px;color:var(--brand-ink);font-weight:600}

/* ---------- Radar ---------- */
.radar{list-style:none;margin:0;padding:0}
.radar li{display:grid;grid-template-columns:20px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--rule);align-items:start}
.radar li:last-child{border-bottom:0}
.radar .sv{width:14px;height:14px;margin-top:5px;background:var(--c)}
.radar .alta{--c:var(--s-rej)} .radar .alta .sv{clip-path:polygon(0 0,100% 0,50% 100%)}
.radar .media{--c:var(--s-pen)} .radar .media .sv{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.radar .info{--c:var(--s-and)} .radar .info .sv{clip-path:polygon(0 0,100% 50%,0 100%)}
.radar b{display:block;font-weight:600;line-height:1.35}
.radar p{margin:3px 0 0;font-size:14.5px;color:var(--muted)}

/* ---------- Faixa de números ---------- */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:26px}
.fig{padding:18px 20px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r)}
.fig span{display:block;font-size:14px;color:var(--muted)}
.fig b{display:block;font-family:var(--display);font-stretch:108%;font-weight:800;font-size:26px;line-height:1.25;margin-top:2px}
.fig em{font-style:normal;font-size:13.5px;color:var(--muted)}

/* ---------- Tarefas ---------- */
.task{display:grid;grid-template-columns:28px 1fr auto;gap:16px;padding:20px 22px;border-bottom:1px solid var(--rule);border-left:4px solid var(--c,var(--rule-strong))}
.task:last-child{border-bottom:0}
.task.p3{--c:var(--s-rej)} .task.p2{--c:var(--s-pen)} .task.p1{--c:var(--s-and)}
.task.done{opacity:.6;--c:var(--rule)}
.task.done .ttl{text-decoration:line-through}
.task input{width:20px;height:20px;margin-top:3px;accent-color:var(--s-ok)}
.task .ttl{font-weight:700;font-size:16.5px}
.task .pri{font-size:13.5px;font-weight:600;margin-left:10px;color:var(--muted)}
.task .pri.p3{color:var(--s-rej)}
.task p{margin:4px 0 0;font-size:15px;color:var(--muted)}
.task .ref{margin-top:2px;font-size:14.5px}
.task .acts{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}

/* ---------- Agenda ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.cal .wd{padding:10px 12px;font-weight:600;font-size:13.5px;color:var(--muted);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.cal .day{min-height:108px;padding:8px;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:4px;background:var(--surface);text-align:left;width:100%}
.cal .day.out{background:var(--surface-2);color:var(--muted)}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--brand)}
.cal .day:hover{background:var(--hover)}
.cal .n{font-weight:600;font-size:13.5px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cal .day.today .n{background:var(--brand);color:var(--on-brand)}
.cal .ev{font-size:12.5px;line-height:1.3;border-left:4px solid var(--c);padding:1px 6px;background:var(--surface-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:3px}
.calwrap{overflow-x:auto;padding-top:4px}
.calwrap .cal{min-width:760px}
.calnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calnav h2{margin:0 8px 0 0;font-family:var(--display);font-stretch:108%;font-size:20px;font-weight:700;min-width:160px}

/* ---------- Gráficos ---------- */
.bars{display:grid;gap:16px;padding:12px 0 4px}
.bar{display:grid;grid-template-columns:minmax(120px,200px) 1fr 84px;gap:14px;align-items:center;font-size:15px}
.bar .track{position:relative;height:22px;background:var(--surface-2);border-radius:6px}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--c,var(--brand));border-radius:6px}
.bar .meta{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--ink)}
.bar .val{text-align:right;font-weight:600}
.legend{font-size:14px;color:var(--muted);margin:10px 0 0}
.cols{display:flex;align-items:flex-end;gap:20px;height:200px;padding:10px 6px 0;border-bottom:1px solid var(--rule-strong)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:14px}
.col .b{width:100%;max-width:96px;background:var(--brand);border-radius:6px 6px 0 0;min-height:3px}
.collabels{display:flex;gap:20px;padding:8px 6px 0;font-size:14px;color:var(--muted)}
.collabels span{flex:1;text-align:center}
.metain{display:inline-flex;align-items:center;gap:8px;font-size:14.5px}
.metain input{width:68px;height:36px;border:1px solid var(--rule-strong);border-radius:8px;padding:0 10px;background:var(--surface)}

/* ---------- Atividade e guia ---------- */
.dayh{font-family:var(--display);font-stretch:108%;font-weight:700;font-size:16px;padding:18px 0 6px}
.feed{list-style:none;margin:0 0 6px;padding:0}
.feed li{display:grid;grid-template-columns:14px 1fr auto;gap:14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--rule)}
.feed li:last-child{border-bottom:0}
.feed .sq{width:12px;height:12px;margin-top:6px;background:var(--c);border-radius:3px}
.feed .sys{font-size:13.5px;color:var(--muted);display:block}
details.rz{border-bottom:1px solid var(--rule)}
details.rz:last-child{border-bottom:0}
details.rz summary{cursor:pointer;padding:16px 4px;display:flex;gap:14px;align-items:center;font-weight:600;list-style:none}
details.rz summary::-webkit-details-marker{display:none}
details.rz summary::before{content:"";width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid var(--brand);transition:transform .15s;flex:none}
details.rz[open] summary::before{transform:rotate(90deg)}
details.rz .in{padding:0 4px 18px 23px;display:grid;gap:10px;font-size:15.5px}
details.rz ol{margin:0;padding-left:20px}
details.rz li{margin:3px 0}
dl.gl{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:0}
dl.gl dt,dl.gl dd{margin:0;padding:13px 4px;border-bottom:1px solid var(--rule)}
dl.gl dt{font-weight:700}
dl.gl dt:last-of-type,dl.gl dd:last-of-type{border-bottom:0}

/* ---------- Painel lateral ---------- */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);z-index:80;transform:translateX(100%);visibility:hidden;transition:transform .25s ease,visibility .25s;display:flex;flex-direction:column;box-shadow:-24px 0 60px -30px rgba(4,16,26,.6);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel.open{transform:none;visibility:visible}
.ph2{display:flex;align-items:flex-start;gap:6px;padding:22px 16px 16px 26px;border-bottom:1px solid var(--rule)}
.ph2 .hd{flex:1;min-width:0}
.ph2 .code{font-weight:700;color:var(--brand-ink);font-size:14.5px}
.ph2 h2{font-family:var(--display);font-stretch:108%;font-weight:700;font-size:24px;line-height:1.2;margin:2px 0 12px}
.ph2 .sline{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;font-size:14.5px}
.ptabs{display:flex;border-bottom:1px solid var(--rule);padding:0 18px;overflow-x:auto}
.ptabs button{border:0;background:none;padding:14px 12px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--brand)}
.panel .body{overflow:auto;padding:24px 26px 28px;flex:1}
.panel .foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 26px;border-top:1px solid var(--rule);background:var(--surface-2);flex-wrap:wrap}
.panel h3{font-family:var(--display);font-stretch:108%;font-size:17px;margin:28px 0 12px}
.panel h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;margin:0}
.kv dt{font-size:13.5px;color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.callout{border-left:5px solid var(--c);background:var(--cb);padding:16px 18px;margin-bottom:18px;border-radius:0 10px 10px 0}
.callout.bad{--c:var(--s-rej);--cb:var(--bad-bg)}
.callout.info{--c:var(--s-and);--cb:var(--info-bg)}
.callout.ok{--c:var(--s-ok);--cb:var(--ok-bg)}
.callout.warn{--c:var(--s-pen);--cb:var(--warn-bg)}
.callout h4{margin:0 0 4px;font-size:16px}
.callout p{margin:0 0 8px;font-size:15.5px}
.callout p:last-child{margin:0}
.eta{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline;border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.eta .big{font-family:var(--display);font-stretch:108%;font-weight:800;font-size:22px;line-height:1.2}
.eta small{color:var(--muted);font-size:13.5px;grid-column:1/-1}
.eta .cf{font-size:13.5px;font-weight:600;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:20px}
.tl li::before{content:"";position:absolute;left:16px;top:28px;bottom:0;width:2px;background:var(--rule)}
.tl li:last-child::before{display:none}
.tl svg{width:26px;height:24px;margin:2px 4px}
.tl b{display:block;line-height:1.3}
.tl .meta{display:block;font-size:14.5px;color:var(--muted)}
.tl .todo b{color:var(--muted);font-weight:500}
.apv{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px;font-size:14.5px}
.apv li{display:flex;gap:10px;padding:0;grid-template-columns:none}
.apv li::before{display:none}
.apv i{font-style:normal;font-weight:700;min-width:88px}
.docs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.docs li{display:flex;align-items:center;gap:12px;border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.docs .t{flex:1;min-width:0;font-size:14.5px}
.docs .t b{display:block;overflow-wrap:anywhere}
.docs .t span{color:var(--muted)}
.hist{list-style:none;margin:0;padding:0 0 0 6px}
.hist li{padding:10px 0 12px 20px;border-left:2px solid var(--rule);position:relative;font-size:15px}
.hist li::before{content:"";position:absolute;left:-6px;top:15px;width:10px;height:10px;background:var(--c);border-radius:3px}
.hist small{display:block;color:var(--muted);font-size:13.5px}
textarea,.txt{width:100%;border:1px solid var(--rule-strong);border-radius:10px;padding:12px 14px;background:var(--surface);resize:vertical}
textarea{min-height:100px}
.txt{height:44px}
.note{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin-top:12px;background:var(--surface-2)}
.note small{display:flex;justify-content:space-between;color:var(--muted);margin-top:6px}
.stagecard{border:1px solid var(--rule);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:52px 1fr;gap:16px;margin-bottom:14px}
.stagecard svg{width:46px;height:42px}
.stagecard h4{margin:0 0 2px;font-size:17px}
.stagecard p{margin:0 0 8px;font-size:15px;color:var(--muted)}
.tags2{display:flex;gap:6px;flex-wrap:wrap}
.tag2{font-size:13px;font-weight:600;background:var(--surface-2);border:1px solid var(--rule);padding:0 9px;border-radius:6px}
.paper{background:#fff;color:#16222c;border:1px solid var(--rule-strong);padding:28px;font-size:14.5px;border-radius:4px}
.paper h3{font-family:var(--display);font-stretch:112%;font-size:21px;margin:0 0 2px}
.paper hr{border:0;border-top:2px solid #16222c;margin:14px 0}
.paper table{min-width:0;font-size:14px}
.paper td,.paper th{border-bottom:1px solid #d5dde3;padding:8px 4px;background:none;color:#16222c;text-align:left;font-weight:500}
.paper th{font-weight:700}
.paper .wm{margin-top:20px;font-size:12.5px;color:#5a6b78}
.sugg{display:flex;flex-direction:column;gap:8px;margin:14px 0 18px}
.sugg button{text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:11px 14px;font-weight:500}
.sugg button:hover{border-color:var(--brand);background:var(--hover)}
.ans{margin-top:18px;border:1px solid var(--rule);border-radius:12px;padding:18px 20px;background:var(--surface-2);font-size:15.5px;line-height:1.65}
.ans:empty{display:none}
.ans .linkbtn{display:inline}
.help dl{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;margin:0}
.help dt{white-space:nowrap}
.help dd{margin:0}

/* ---------- Paleta de busca ---------- */
.cmd{position:fixed;inset:0;z-index:90;background:rgba(6,20,32,.55);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.cmd-box{width:min(660px,100%);background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);max-height:72vh;display:flex;flex-direction:column}
.cmd-in{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--rule);height:58px}
.cmd-in svg{width:20px;height:20px;color:var(--muted)}
.cmd-in input{flex:1;border:0;outline:0;background:none;height:100%;font-size:17px}
.cmd ul{list-style:none;margin:0;padding:8px;overflow:auto}
.cmd .g{padding:10px 12px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.cmd li button{width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;display:flex;flex-direction:column}
.cmd li button small{color:var(--muted);font-size:13.5px}
.cmd li button[aria-selected="true"]{background:var(--brand-tint)}
.cmd-foot{padding:10px 18px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:10px;font-size:15px;opacity:0;visibility:hidden;transition:all .2s;z-index:100;max-width:min(540px,92vw)}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* ---------- Assistente ---------- */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:10px;height:52px;padding:0 22px 0 16px;border-radius:26px;border:0;background:var(--rail);color:#fff;font-weight:600;box-shadow:0 12px 30px -10px rgba(4,16,26,.65);outline:1px solid rgba(255,255,255,.16);outline-offset:-1px}
.fab:hover{background:var(--rail-2)}
.fab .av{width:40px;height:40px;background:var(--logo-dark) center/contain no-repeat;flex:none;margin-left:-2px}
.panel .body.chatlog{display:flex;flex-direction:column;gap:14px;padding-bottom:18px}
.msg{max-width:94%;font-size:15.5px;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--rail);color:#fff;border-radius:14px 14px 3px 14px;padding:10px 16px}
.msg.b{align-self:flex-start;background:var(--surface-2);border:1px solid var(--rule);border-radius:14px 14px 14px 3px;padding:14px 18px}
.msg.b p{margin:0 0 8px}
.msg.b p:last-child{margin:0}
.msg.b ul,.msg.b ol{margin:6px 0 8px;padding-left:20px}
.msg.b li{margin:7px 0}
.msg .linkbtn{display:inline}
.acts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chatfoot{border-top:1px solid var(--rule);padding:12px 18px 14px;background:var(--surface-2)}
.chips2{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chips2 button{flex:none;border:1px solid var(--rule-strong);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:500}
.chips2 button:hover{border-color:var(--brand);background:var(--hover)}
#chatForm{display:flex;gap:8px}
#chatForm .txt{flex:1}
.chatnote{margin:10px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:820px){.fab span:not(.av){display:none}.fab{padding:0 12px 0 12px}}

@media (max-width:1100px){
  .grid2,.grid2.wide{grid-template-columns:1fr}
}
@media (max-width:820px){
  :root{--railw:280px}
  .brandbar{width:auto;padding-right:14px}
  body.collapsed .brandbar{width:auto}
  body.collapsed .brand span{display:inline}
  nav#nav{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + var(--hh));bottom:0;height:auto;transform:translateX(-100%);transition:transform .22s ease;z-index:75;width:280px}
  body.navopen nav#nav{transform:none}
  body.collapsed nav#nav .lbl,body.collapsed nav#nav .grp{display:inline}
  body.collapsed nav#nav .badge{display:inline}
  body.collapsed nav#nav a{justify-content:flex-start;padding:10px 24px}
  .cmdk{width:auto;flex:none;margin-left:auto;padding:0 10px}
  .cmdk span,.cmdk kbd{display:none}
  .tools{padding-left:4px;margin-left:0}
    .board{grid-template-columns:1fr}
  .scrollx .board{min-width:0}
  .stn-h,.stn:first-child .stn-h{width:100%;clip-path:none;border-radius:0;padding:0 18px;height:60px}
  .kv{grid-template-columns:1fr}
  .bar{grid-template-columns:1fr 70px}
  .bar .lab{grid-column:1/-1}
  .task{grid-template-columns:28px 1fr}
  .task .acts{grid-column:2;justify-content:flex-start}
  .findrow{flex-direction:column}
  .findrow .field{flex:none}
  .findrow .btn{width:100%}
  dl.gl{grid-template-columns:1fr}
  dl.gl dt{border-bottom:0;padding-bottom:0}
  .hero h1{max-width:none}
}
@media (max-width:560px){.avatar{display:none}.tools{padding-right:8px;gap:2px}.cmdk{margin-left:auto}}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* ---------- Derivações ---------- */
function track(r){
  const done=r.status==="Concluída";
  return `<span class="trk" role="img" aria-label="Etapa ${r.stage+1} de 5: ${STAGES[r.stage].name}">`+STAGES.map((s,i)=>{
    const k=(i<r.stage||(done&&i===4))?"d":i===r.stage?(r.status==="Recusada"?"b":"c"):"t";
    return `<i class="${k}" style="--c:${s.color}"></i>`}).join("")+`</span>`;
}
function stageStarts(r){
  if(r.stage===0)return [r.age];
  const out=[];for(let i=0;i<r.stage;i++)out.push(Math.round(r.age-(r.age-r.inStage)*i/r.stage));
  out.push(r.inStage);return out;
}
function approvalInfo(r){
  if(r.stage===0)return null;
  if(r.status==="Recusada"&&r.rej)return{sit:"Recusada",who:r.rej.byName,role:r.rej.byRole};
  if(r.stage===1){const w=r.ap.find(a=>a.state==="wait");return{sit:"Aguardando aprovação",who:w?w.name:r.owner.name,role:w?w.role:r.owner.role}}
  if(r.stage===3)return{sit:"Em análise",who:r.owner.name,role:r.owner.role};
  const oks=r.ap.filter(a=>a.state==="ok"),l=oks[oks.length-1];
  return{sit:"Aprovada",who:l?l.name:"—",role:l?l.role:""};
}
/* Estimativa de pagamento: usa a previsão do SAP quando existe; senão, soma o tempo típico das etapas que faltam */
function eta(r){
  if(r.status==="Concluída")return{kind:"paid",n:r.fc,text:"Pago em "+dstr(-r.fc,true),short:"Pago em "+dstr(-r.fc),sort:-1000-r.fc,conf:"Confirmado no SAP"};
  if(r.fc!=null)return{kind:"sap",n:r.fc,text:"Previsto para "+fmtD(payDate(r)),short:fmtD(payDate(r)),sort:r.fc,conf:"Previsão do SAP"};
  let d=Math.max(1,TYP[r.stage]-r.inStage);for(let i=r.stage+1;i<5;i++)d+=TYP[i];
  if(r.rej)d+=4;if(isLate(r))d+=3;
  const lo=Math.round(d*.85),hi=Math.round(d*1.35)+1;
  return{kind:"est",lo,hi,text:"Entre "+fmtD(addDays(lo))+" e "+fmtD(addDays(hi)),short:fmtD(addDays(lo))+" a "+fmtD(addDays(hi)),sort:lo,conf:(r.rej||isLate(r))?"Confiança baixa":"Confiança média"};
}

  if(r.po)add("Pedido de compra","PO "+r.po,"Coupa",base-1,"Pedido");
  if(r.stage>=1)add("Cotação comparativa",r.rc,"Coupa",base,"Cotacao");
  if(r.ct)add("Contrato",r.ct,"Coupa",base-1,"Contrato");
  if(r.nf)add("Nota fiscal","NF "+r.nf,"Portal de Fornecedor",Math.round(base/2)+r.inStage,"NF");
  if(r.sap)add("Folha de pagamento","Folha "+r.sap,"SAP",r.inStage+(r.stage===4?r.inStage:1),"Folha");
  if(r.stage>=3&&r.sap)add("Solicitação de pagamento",r.rc,"AlpaFlow",r.inStage+(r.stage===4?r.inStage:0),"Solicitacao");

});

function eventsOf(r){
  const st=stageStarts(r),ev=[];
  const add=(a,sys,who,text)=>ev.push({rc:r.rc,ago:Math.max(0,a),sys,who,text});
  add(r.age,"Coupa",ML,"criou a requisição");
  if(r.stage>=1)add(st[1],"Coupa",ML,"enviou o pedido para aprovação");
  const oks=r.ap.filter(a=>a.state==="ok");
  oks.forEach((a,i)=>add((r.stage>=2?st[2]:Math.max(0,r.inStage-1))+(oks.length-1-i),"Coupa",a.name,"aprovou o pedido"));
  if(r.stage>=2&&r.po)add(st[2],"Coupa",null,"PO "+r.po+" gerado");
  if(r.nf)add(r.stage>=3?st[3]+1:Math.max(0,r.inStage-1),"Portal de Fornecedor",r.sup,"enviou a NF "+r.nf);
  if(r.sap)add(r.stage>=3?st[3]+1:r.inStage,"SAP",ML,"criou a folha "+r.sap);
  if(r.stage>=3)add(st[3],"AlpaFlow",ML,"abriu a solicitação de pagamento");
  if(r.rej)add(r.upd,r.stage===1?"Coupa":"AlpaFlow",r.rej.byName,"recusou "+(r.stage===1?"o pedido":"a solicitação de pagamento"));
  if(r.stage===4&&active(r))add(st[4],"SAP",null,"Pagamento programado para "+dstr(-r.fc));
  if(r.status==="Concluída")add(r.upd,"SAP",null,"Pagamento confirmado");
  return ev;
}
const nudges=()=>store.get("ah_nudges",[]);
const nudgedToday=rc=>nudges().some(n=>n.rc===rc&&new Date(n.ts).toDateString()===TODAY.toDateString());
function allEvents(){
  let ev=[];REQS.forEach(r=>{ev=ev.concat(eventsOf(r))});
  nudges().forEach(n=>{const r=byRc(n.rc);if(!r)return;ev.push({rc:n.rc,ago:Math.max(0,Math.floor((Date.now()-n.ts)/864e5)),sys:"Alpacas Hub",who:"Você",text:"cobrou "+r.owner.name+" sobre a solicitação"})});
  return ev.sort((a,b)=>a.ago-b.ago);
}
function tasksOf(){
  const t=[];
  REQS.forEach(r=>{
    if(!active(r))return;
    if(r.rej)t.push({id:r.rc+":fix",rc:r.rc,pri:3,title:r.stage===1?"Corrigir e reabrir a requisição":"Corrigir e reenviar o pagamento",text:r.rej.acao,sys:r.stage===1?"Coupa":"AlpaFlow",since:r.inStage});
    else if(r.stage===0)t.push({id:r.rc+":draft",rc:r.rc,pri:1,title:"Concluir a requisição",text:"Preencha motivo, fornecedor, valor e PDE e envie para aprovação.",sys:"Coupa",since:r.inStage});
    else if(r.stage===2&&r.nf&&!r.sap)t.push({id:r.rc+":folha",rc:r.rc,pri:2,title:"Criar a folha de pagamento",text:"A NF "+r.nf+" já chegou. Crie a folha no SAP e anexe a nota.",sys:"SAP",since:r.inStage});
    else if(r.stage===2&&!r.nf&&r.inStage>=7)t.push({id:r.rc+":nf",rc:r.rc,pri:2,title:"Cobrar a nota fiscal",text:r.sup+" ainda não enviou a NF pelo Portal.",sys:"Portal de Fornecedor",since:r.inStage,nudge:true});
    else if(r.stage===1&&r.inStage>=5)t.push({id:r.rc+":apr",rc:r.rc,pri:2,title:"Cobrar a aprovação",text:"Aguardando "+r.owner.name+" ("+r.owner.role+").",sys:"Coupa",since:r.inStage,nudge:true});
  });
  return t.sort((a,b)=>b.pri-a.pri||b.since-a.since);
}

/* ---------- Radar de riscos ---------- */
function radar(){
  const out=[];
  REQS.filter(r=>r.stage===2&&!r.nf&&r.inStage>=10&&active(r)).forEach(r=>out.push({sev:"alta",t:r.sup+" ainda não enviou a nota fiscal",s:r.rc+" espera há "+days(r.inStage)+". O pagamento só começa depois da NF.",l:"Cobrar fornecedor",attr:`data-nudge="${r.rc}"`}));
  const rj=REQS.filter(r=>r.rej);
  if(rj.length)out.push({sev:"alta",t:pl(rj.length,"solicitação recusada precisa","solicitações recusadas precisam")+" de correção",s:money(rj.reduce((a,r)=>a+r.val,0))+" estão parados até você corrigir. Cada uma mostra o motivo e o que fazer.",l:"Ver como corrigir",attr:'data-go="recusas"'});
  REQS.filter(r=>r.stage===1&&!r.rej&&r.inStage>=META_DEFAULT).sort((a,b)=>b.inStage-a.inStage).forEach(r=>out.push({sev:"media",t:"A aprovação de "+r.rc+" está demorando",s:r.owner.name+" ("+r.owner.role+") está com o pedido de "+money(r.val)+" há "+days(r.inStage)+".",l:"Cobrar aprovação",attr:`data-nudge="${r.rc}"`}));
  Object.keys(SUP).forEach(n=>{
    if(SUP[n].cad==="Ativo")return;
    const rs=REQS.filter(r=>r.sup===n&&active(r)&&!r.rej);
    if(rs.length)out.push({sev:"media",t:n+" está com o cadastro "+SUP[n].cad.toLowerCase(),s:pl(rs.length,"pedido ativo","pedidos ativos")+" com este fornecedor. Confirme o cadastro para evitar uma recusa.",l:"Ver fornecedor",attr:`data-sup="${esc(n)}"`});
  });
  const w=REQS.filter(r=>active(r)&&r.fc!=null&&r.fc>=0&&r.fc<=7);
  if(w.length)out.push({sev:"info",t:money(w.reduce((a,r)=>a+r.val,0))+" serão pagos nos próximos 7 dias",s:pl(w.length,"pagamento programado","pagamentos programados")+" no SAP.",l:"Abrir agenda",attr:'data-go="agenda"'});
  const rank={alta:0,media:1,info:2};
  return out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
}

function matchField(r,q){
  const f=[["RC",r.rc],["PO",r.po],["Contrato",r.ct],["NF",r.nf],["Folha SAP",r.sap],["Fornecedor",r.sup],["Descrição",r.desc],["Responsável",r.owner.name]];
  for(const x of f){if(x[1]&&norm(x[1]).includes(q))return x[0]+" "+x[1]}
  return null;
}

function supAgg(){
  return Object.keys(SUP).map(n=>{
    const rs=REQS.filter(r=>r.sup===n),at=rs.filter(active),nfs=rs.filter(r=>r.stage===2&&!r.nf);
    const parado=at.reduce((m,r)=>Math.max(m,r.inStage),0);
    let atencao="Sem pendências",lvl="ok";
    if(SUP[n].cad.startsWith("Inativo")){atencao="Cadastro inativo para a categoria";lvl="rej"}
    else if(SUP[n].cad!=="Ativo"){atencao="Cadastro "+SUP[n].cad.toLowerCase();lvl="pen"}
    else if(nfs.some(r=>r.inStage>=10)){atencao="NF atrasada há "+days(Math.max(...nfs.map(r=>r.inStage)));lvl="rej"}
    else if(nfs.length){atencao=pl(nfs.length,"NF aguardada","NFs aguardadas");lvl="pen"}
    else if(at.some(r=>r.rej)){atencao="Tem solicitação recusada";lvl="rej"}
    return Object.assign({nome:n,_k:lvl,_open:"sup:"+n,rcs:at.length,aberto:at.reduce((a,r)=>a+r.val,0),atencao,lvl,parado},SUP[n]);
  });
}
function supRows(){
  const s=state.forn,q=norm(s.q.trim());
  return supAgg().filter(x=>{
    if(q&&!norm([x.nome,x.cat,x.cnpj,x.contato].concat(REQS.filter(r=>r.sup===x.nome).map(r=>r.rc)).join(" ")).includes(q))return false;
    if(s.f.cat&&x.cat!==s.f.cat)return false;
    if(s.f.cad&&x.cad!==s.f.cad)return false;
    return true;
  });
}

function ents(q){
  const n=norm(q),e={};
  let m=n.match(/rc[-\s]?(\d{6})/);
  if(m){if(byRc("RC-"+m[1]))e.rc="RC-"+m[1];else e.missing="RC-"+m[1]}
  if(!e.rc&&!e.missing){m=n.match(/\b(\d{6})\b/);if(m&&byRc("RC-"+m[1]))e.rc="RC-"+m[1]}
  if(!e.rc){
    m=n.match(/\b(\d{3,10})\b/);
    if(m){const r=REQS.find(x=>x.nf===m[1]||x.po===m[1]||x.sap===m[1]);if(r){e.rc=r.rc;e.via=m[1]}else if(/\b(nf|nota|po|pedido|folha)\b/.test(n))e.missing="o número "+m[1]}
  }
  const words=n.replace(/[^a-z0-9\s]/g," ").split(/\s+/);
  let best=0,cands=[];
  Object.keys(SUP).forEach(s=>{const sc=supTok(s).filter(t=>words.includes(t)).length;if(sc>best){best=sc;cands=[s]}else if(sc===best&&sc>0)cands.push(s)});
  if(cands.length===1)e.sup=cands[0];else if(cands.length>1)e.supAmb=cands;
  const p=PEOPLE.find(x=>words.includes(norm(x.split(" ")[0])));if(p)e.person=p;
  return e;
}

function payWin(n){
  if(/amanha/.test(n))return{lo:1,hi:1,l:"amanhã"};
  if(/\bhoje\b/.test(n))return{lo:0,hi:0,l:"hoje"};

const FALLBACK_STOP=new Set(["qual","quais","quem","como","esta","estao","onde","sobre","quero","saber","tenho","preciso","para","com","uma","uns","que","dos","das","nao","por","mais","menos","tem","ter","sao","foi","fui","vou","pode","posso","voce","solicitacao","solicitacoes","requisicao","pedido","pedidos","fornecedor","fornecedores","status","dados","informacao","informacoes"]);

/* ----- roteador de perguntas ----- */
function reply(q){
  const n=norm(q).replace(/[?!.,;:]+/g," ").replace(/\s+/g," ").trim(),e=ents(q),W=(...a)=>a.some(w=>n.includes(w));
  if(/^(oi|ola|bom dia|boa tarde|boa noite|e ai|opa)( |$)/.test(n)&&n.split(" ").length<=4)return aGreet();
  if(W("obrigad","valeu"))return mk("<p>Por nada! Se precisar de mais alguma coisa, é só perguntar.</p>");
  if(/previsao do tempo|\bclima\b|\bchuva\b|futebol|\bpiada\b|\bnoticias?\b|\bdolar\b|horoscopo|receita de/.test(n))return aFallback(n);
  if(e.missing)return mk(`<p>Não encontrei ${esc(e.missing)} nos dados desta página. Confira o número ou busque pelo nome do fornecedor.</p>`);
  if(W("ajuda","o que voce faz","o que voce sabe","o que posso perguntar","como voce funciona")&&!e.rc)return aHelp();
  const gl=glossFind(n);
  if(gl&&W("o que e","o que significa","significa","quer dizer","o que sao","defina","explique"))return aGloss(gl);
  const rt=routeFind(n);
  if(rt&&W("abrir","abra","ir para","va para","me leve","mostrar a tela","mostre a tela","navegar","ver a tela","tela de"))return aNav(rt);
  if(e.supAmb)return mk(`<p>Encontrei mais de um fornecedor com esse nome. Qual deles?</p>`,e.supAmb);
  if(e.sup&&!e.rc&&W("cnpj","contato","telefone","endereco","e-mail","email")){const m=SUP[e.sup],sh=shortSup(e.sup);CHAT.ctx.sup=e.sup;CHAT.ctx.rc=null;return mk(`<p><b>${esc(e.sup)}</b>: CNPJ ${esc(m.cnpj)}. Contato: ${esc(m.contato)}.</p><p class="mut">Não tenho telefone, e-mail nem endereço deste fornecedor nos dados do Hub.</p>`,["Como está "+sh+"?","Quanto há em aberto com "+sh+"?"])}
  const sub=W("por que","porque","motivo","recus","rejeit")?"rej":W("quem","responsavel","com quem")?"who":W("quando","previs","pagar","paga","pagamento","receber","data")?"pay":W("document","arquivo","anexo","falta")?"docs":W("o que fazer","proximo passo","corrigir","como resolver","o que preciso","o que devo")?"next":"status";
  const pron=/\b(ela|dela|essa|dessa|mesma|nela)\b/.test(n)&&!/semana|mes|hoje|amanha/.test(n);
  const shortFollow=n.split(" ").length<=5&&!W("todas","quais","quantas","quantos","quanto","proxim","semana","mes","fornecedores","atrasad","parad","resum","hoje","agora","tudo","amanha","pagamentos","aprovacoes","notas","documentos","recusadas","pendencias");
  const rc=e.rc||(CHAT.ctx.rc&&(pron||(shortFollow&&sub!=="status"))&&!e.sup&&!e.person?CHAT.ctx.rc:null);
  if(!rc&&pron&&!CHAT.ctx.rc&&sub!=="status")return mk("<p>De qual solicitação você está falando? Me diga o número da RC, PO ou NF.</p>");
  if(rc){const r=byRc(rc);return {rej:aReject,who:aWho,pay:aPay,docs:aDocs,next:aNext,status:aStatus}[sub](r)}
  const sc=e.sup?{f:r=>r.sup===e.sup,lbl:"do fornecedor "+e.sup}:e.person?{f:r=>(r.who||r.owner.name)===e.person||r.owner.name===e.person,lbl:"com "+e.person}:{f:()=>true,lbl:""};
  if(W("resum","panorama","visao geral","como estou","como esta a minha"))return aSummary();
  if(W("fornecedor")&&W("atencao","problema","risco","cadastro","renovac")&&!e.sup)return aSupAttention();
  if(W("quantas","quantos")&&stageFrom(n)==null){
    if(W("fornecedor")&&!e.sup)return aSuppliersAll();
    if(W("document"))return aDocCount();
    if(W("pendencia","tarefa"))return aTasks();
    if(W("aprovac"))return aApprovals(sc);
    if(W("pagamento"))return aPayments(sc,n);
    if(/\bnfs?\b/.test(n)||W("nota fiscal","notas fiscais"))return aNF();
  }
  if(W("fornecedor")&&!e.sup&&W("existem","cadastrad","lista","todos os fornecedores","quais fornecedores","fornecedores temos","fornecedores tenho"))return aSuppliersAll();
  if(W("atrasad","parad","demor","travad","gargalo"))return aStuck(sc);
  if(W("recusad","recusa","rejeitad","corrigir"))return aRejected(sc);
  if(W("pendencia","tarefa","preciso fazer","o que fazer","minha acao","urgente"))return aTasks();
  if(W("aprovac","aprovar","aprovador"))return aApprovals(sc);
  if(W("pagar","pagamento","previs","receber","vencer","vence","agenda"))return aPayments(sc,n);
  if(/\bnfs?\b/.test(n)||W("nota fiscal","notas fiscais","sem nota"))return aNF();
  if(W("document","anexo","faltando","falta anexar"))return aMissingDocs();
  if(W("risco","alerta","radar","atencao"))return aRadar();
  if(W("acompanhando","favorit","estrela"))return aFavs();
  if(W("quantas","quantos","quanto","total","soma","em aberto","valor"))return aNumbers(sc,n);
  if(e.sup)return aSupplier(e.sup);
  if(e.person)return aPerson(e.person);
  if(W("fornecedores"))return aSuppliersAll();
  return aFallback(n);
}

function openChat(trigger,preset){
  if(!CHAT.msgs.length){const g=aGreet();CHAT.msgs.push({r:"b",h:g.h,chips:g.chips})}
  openPanel(`<header class="ph2"><div class="hd"><span class="code">Assistente</span><h2 id="panel-title">Pergunte ao Hub</h2><div class="sline"><span class="mut">Responde só com os dados desta página.</span></div></div><button class="icon-btn" type="button" data-chatclear aria-label="Limpar conversa" title="Limpar conversa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>${closeBtn}</header>
  <div class="body chatlog" id="chatLog" role="log" aria-live="polite"></div>
  <div class="chatfoot"><div class="chips2" id="chatSugg"></div><div id="chatForm"><label class="sr" for="chatIn">Sua pergunta</label><input id="chatIn" class="txt" type="text" placeholder="Pergunte sobre uma RC, fornecedor ou pagamento"><button class="btn" type="button" data-chatsend>Enviar</button></div><p class="chatnote">Este assistente funciona com regras próprias, sem inteligência artificial externa. Ele só conhece o que aparece nas telas do Hub.</p></div>`,trigger,"#chatIn");
  curPanel=null;renderChat();

function chatSend(text){
  text=text.trim();if(!text)return;
  CHAT.msgs.push({r:"u",h:esc(text)});CHAT.typing=true;renderChat();
  setTimeout(()=>{
    CHAT.typing=false;let out;

    CHAT.msgs.push({r:"b",h:out.h,chips:out.chips});renderChat();
  },260);
}

let dl=null;
if(window.claude&&claude.use){claude.use("downloads").then(d=>{dl=d}).catch(()=>{})}
function saveFile(filename,data,okMsg){
  okMsg=okMsg||"Arquivo exportado.";
  if(dl){dl.save({filename,data}).then(()=>toast(okMsg)).catch(e=>{if(!e||e.code!=="declined")toast("Não foi possível exportar agora.")});return}
  try{
    const mime=/\.csv$/.test(filename)?"text/csv;charset=utf-8":/\.html$/.test(filename)?"text/html;charset=utf-8":"text/plain;charset=utf-8";
    const url=URL.createObjectURL(new Blob([data],{type:mime})),a=document.createElement("a");
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},600);toast(okMsg);
  }catch(err){toast("Não foi possível exportar agora.")}
}

  const pg=PAGES[FILLERS(id)];if(!pg||!pg.csv)return;
  saveFile(pg.file,"\uFEFF"+pg.csv().map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n"));
}
function dossier(rc){
  const r=byRc(rc);if(!r)return;
  const ev=eventsOf(r).sort((a,b)=>a.ago-b.ago),e=eta(r);
  const html=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Dossiê ${esc(r.rc)}</title><style>body{font:15px/1.55 system-ui,sans-serif;max-width:780px;margin:32px auto;padding:0 20px;color:#0b1f2e}h1{font-size:26px;margin:0 0 4px}h2{font-size:17px;margin:28px 0 8px;border-bottom:2px solid #0073b4;padding-bottom:4px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #d5dde3;padding:7px 6px;text-align:left;vertical-align:top}th{width:34%;font-weight:600;color:#44596a}.m{color:#59707f;font-size:13px}</style></head><body><h1>${esc(r.desc)}</h1><div class="m">${esc(r.rc)}. Gerado em ${dstr(0,true)} pelo Alpacas Hub (dados de demonstração).</div>
<h2>Resumo</h2><table><tr><th>Situação</th><td>${esc(r.status)}</td></tr><tr><th>Etapa atual</th><td>${esc(STAGES[r.stage].name)} (${esc(STAGES[r.stage].sys)})</td></tr><tr><th>Com quem está</th><td>${esc(r.owner.name)}, ${esc(r.owner.role)}</td></tr><tr><th>Pagamento</th><td>${esc(e.text)} (${esc(e.conf)})</td></tr><tr><th>Fornecedor</th><td>${esc(r.sup)}</td></tr><tr><th>Valor</th><td>${money(r.val)}</td></tr><tr><th>PO / Contrato</th><td>${esc(r.po||"—")} / ${esc(r.ct||"—")}</td></tr><tr><th>NF / Folha SAP</th><td>${esc(r.nf||"—")} / ${esc(r.sap||"—")}</td></tr></table>
${r.rej?`<h2>Recusa</h2><table><tr><th>Recusada por</th><td>${esc(r.rej.byName)}, ${esc(r.rej.byRole)}</td></tr><tr><th>Motivo</th><td>${esc(r.rej.motivo)}</td></tr><tr><th>O que fazer</th><td>${esc(r.rej.acao)}</td></tr></table>`:""}
<h2>Documentos</h2><table>${docsFor(rc).map(d=>`<tr><th>${esc(d.type)}</th><td>${esc(d.name)}<br><span class="m">${esc(d.origin)}, ${dstr(d.ago,true)}</span></td></tr>`).join("")}</table>
<h2>Histórico</h2><table>${ev.map(x=>`<tr><th>${dstr(x.ago,true)}</th><td>${x.who?esc(x.who)+" ":""}${esc(x.text)}<br><span class="m">${esc(x.sys)}</span></td></tr>`).join("")}</table></body></html>`;
  saveFile("dossie-"+rc+".html",html,"Dossiê exportado.");
}

/* =============== Busca global (Ctrl K) =============== */
const cmd=document.getElementById("cmd"),cmdIn=document.getElementById("cmdIn"),cmdList=document.getElementById("cmdList");
let cmdItems=[],cmdSel=0,cmdFocus=null;
const QUICK_WORDS=[
 {w:["atrasad","parad"],l:"Solicitações paradas há 7+ dias",go:()=>{state.sol.view="paradas";go("solicitacoes")}},
 {w:["recusad","correc","erro"],l:"Solicitações que precisam de correção",go:()=>{state.sol.view="correcao";go("solicitacoes")}},
 {w:["semana","pagar","pagas"],l:"Pagas esta semana",go:()=>{state.sol.view="semana";go("solicitacoes")}},
 {w:["fornecedor","nota","nf"],l:"Solicitações com o fornecedor",go:()=>{state.sol.view="fornecedor";go("solicitacoes")}},
 {w:["aprova"],l:"Em aprovação",go:()=>{state.sol.view="aprovacao";go("solicitacoes")}}
];
function cmdBuild(q){
  q=norm(q.trim());const out=[];
  const push=(g,items)=>{if(items.length)out.push({g,items})};
  if(q)push("Visões rápidas",QUICK_WORDS.filter(x=>x.w.some(w=>q.includes(w)||w.startsWith(q))).map(x=>({t:x.l,s:"Abrir lista filtrada",run:x.go})));
  push("Telas",ROUTES.filter(r=>!q||norm(r.label).includes(q)).slice(0,q?4:11).map(r=>({t:r.label,s:r.grp,run:()=>go(r.id)})));
  if(q){
    push("Solicitações",REQS.filter(r=>norm([r.rc,r.desc,r.sup,r.po,r.ct,r.nf,r.sap].join(" ")).includes(q)).slice(0,6).map(r=>({t:r.rc+" "+r.desc,s:r.sup+", "+STAGES[r.stage].name+(matchField(r,q)?". Achou em "+matchField(r,q):""),run:()=>openRequest(r.rc,cmdFocus)})));
    push("Fornecedores",Object.keys(SUP).filter(n=>norm(n+" "+SUP[n].cat+" "+SUP[n].cnpj).includes(q)).slice(0,4).map(n=>({t:n,s:SUP[n].cat,run:()=>openSupplier(n,cmdFocus)})));
    push("Documentos",DOCS.filter(d=>norm(d.name+" "+d.type+" "+d.ref).includes(q)).slice(0,4).map(d=>({t:d.name,s:d.type+", "+d.sup,run:()=>openDoc(d.id,cmdFocus)})));
  }
  return out;
}
function cmdRender(){
  const groups=cmdBuild(cmdIn.value);cmdItems=[];let h="";
  groups.forEach(g=>{h+=`<li class="g" role="presentation">${g.g}</li>`;g.items.forEach(it=>{const i=cmdItems.length;cmdItems.push(it);h+=`<li role="presentation"><button type="button" role="option" data-ci="${i}" aria-selected="${i===cmdSel}"><span>${esc(it.t)}</span><small>${esc(it.s)}</small></button></li>`})});
  if(!cmdItems.length)h=`<li class="g" role="presentation">Nenhum resultado para “${esc(cmdIn.value)}”. Tente o número de uma RC, PO, NF ou o nome do fornecedor.</li>`;
  cmdList.innerHTML=h;
  const s=cmdList.querySelector('[aria-selected="true"]');if(s&&s.scrollIntoView)s.scrollIntoView({block:"nearest"});
}
function cmdOpen(){cmdFocus=document.activeElement;cmd.hidden=false;cmdIn.value="";cmdSel=0;cmdRender();cmdIn.focus()}
function cmdClose(){cmd.hidden=true;if(cmdFocus&&cmdFocus.focus)cmdFocus.focus()}
function cmdRun(i){const it=cmdItems[i];if(!it)return;cmd.hidden=true;it.run()}
cmdIn.addEventListener("input",()=>{cmdSel=0;cmdRender()});
cmdIn.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();cmdSel=Math.min(cmdItems.length-1,cmdSel+1);cmdRender()}
  else if(e.key==="ArrowUp"){e.preventDefault();cmdSel=Math.max(0,cmdSel-1);cmdRender()}
  else if(e.key==="Enter"){e.preventDefault();cmdRun(cmdSel)}
});
cmd.addEventListener("click",e=>{if(e.target===cmd)cmdClose();const b=e.target.closest("[data-ci]");if(b)cmdRun(+b.getAttribute("data-ci"))});
document.getElementById("cmdBtn").addEventListener("click",cmdOpen);
document.getElementById("fab").addEventListener("click",e=>openChat(e.currentTarget));
if(/Mac|iPhone|iPad/.test(navigator.platform||""))document.getElementById("kbdHint").textContent="⌘ K";

/* =============== Eventos =============== */
const SEL="[data-open],[data-rowopen],[data-doc],[data-sup],[data-fav],[data-nudge],[data-go],[data-stage],[data-journey],[data-sort],[data-mode],[data-view],[data-more],[data-clear],[data-act],[data-close],[data-export],[data-ptab],[data-guide],[data-savenote],[data-delnote],[data-month],[data-day],[data-help],[data-dosearch],[data-chatsend],[data-chat],[data-chatq],[data-chatclear],[data-gov],[data-copydraft],[data-regnudge],[data-weekly],[data-dossier]";
document.addEventListener("click",e=>{
  const t=e.target.closest(SEL);if(!t)return;
  const g=a=>t.getAttribute(a),has=a=>t.hasAttribute(a),inPanel=panel.contains(t);
  if(has("data-rowopen")){const [k,v]=g("data-rowopen").split(/:(.+)/);const trg=t.querySelector("button.main")||t;if(k==="req")openRequest(v,trg);else if(k==="sup")openSupplier(v,trg);else if(k==="doc")openDoc(v,trg);return}
  if(has("data-open")){e.preventDefault();openRequest(g("data-open"),inPanel?null:t,null);return}
  if(has("data-doc")){openDoc(g("data-doc"),inPanel?null:t);return}
  if(has("data-sup")){openSupplier(g("data-sup"),inPanel?null:t);return}
  if(has("data-fav")){toggleFav(g("data-fav"));return}
  if(has("data-nudge")){const rcs=g("data-nudge").split(",").filter(rc=>!nudgedToday(rc));if(!rcs.length){toast("Você já cobrou hoje.");return}openNudge(rcs,inPanel?null:t);return}
  if(has("data-regnudge")){nudge(g("data-regnudge"));closePanel();refresh();return}
  if(has("data-dosearch")){runSearch(t.closest("[data-search]"));return}
  if(has("data-chatsend")){runChat();return}
  if(has("data-chat")){openChat(inPanel?null:t,g("data-chat"));return}
  if(has("data-chatq")){chatSend(g("data-chatq"));const i=document.getElementById("chatIn");if(i)i.focus();return}
  if(has("data-chatclear")){CHAT.msgs=[];CHAT.ctx={rc:null,sup:null};openChat(null);return}
  if(has("data-gov")){const [id,v]=g("data-gov").split(":");state[id].view=v;state[id].q="";state[id].f={};closePanel();go(FILLERS(id));return}
  if(has("data-copydraft")){const ta=document.getElementById("ndBody");copyText((document.getElementById("ndSub").value?"Assunto: "+document.getElementById("ndSub").value+"\n\n":"")+ta.value,ta);return}
  if(has("data-guide")){const id=g("data-guide");closePanel();go("recusas");setTimeout(()=>{const d=document.getElementById("pb-"+id);if(d){d.open=true;d.scrollIntoView({block:"center"})}},60);return}
  if(has("data-stage")){state.sol.q="";state.sol.f={stage:g("data-stage")};state.sol.view="todas";state.sol.more=true;go("solicitacoes");return}
  if(has("data-journey")){openJourney(t);return}
  if(has("data-help")){openHelp(t);return}
  if(has("data-go")){const r=g("data-go");if(has("data-close"))closePanel();go(r);return}
  if(has("data-sort")){const [id,k]=g("data-sort").split("|"),s=state[id].sort;s.d=s.k===k?-s.d:1;s.k=k;PAGES[FILLERS(id)].fill();const b=document.querySelector('[data-sort="'+id+"|"+k+'"]');if(b)b.focus();return}
  if(has("data-mode")){const [id,m]=g("data-mode").split(":");state[id].mode=m;PAGES[FILLERS(id)].fill();return}
  if(has("data-view")){const [id,k]=g("data-view").split(":");state[id].view=k;PAGES[FILLERS(id)].render();const b=document.querySelector('[data-view="'+id+":"+k+'"]');if(b)b.focus();return}
  if(has("data-more")){const id=g("data-more");state[id].more=!state[id].more;PAGES[FILLERS(id)].render();const b=document.querySelector('[data-more="'+id+'"]');if(b)b.focus();return}
  if(has("data-clear")){const id=g("data-clear");state[id].f={};state[id].q="";if(state[id].view)state[id].view=id==="pag"?"todos":"todas";PAGES[FILLERS(id)].render();return}
  if(has("data-export")){exportCsv(g("data-export"));return}
  if(has("data-weekly")){saveFile("resumo-semanal.md",weeklyMd(),"Resumo exportado.");return}
  if(has("data-dossier")){dossier(g("data-dossier"));return}
  if(has("data-act")){toast(g("data-act"));return}
  if(has("data-ptab")){if(curPanel)openRequest(curPanel.rc,null,g("data-ptab"));return}
  if(has("data-savenote")){const rc=g("data-savenote"),v=document.getElementById("noteText").value.trim();if(!v){toast("Escreva a nota antes de salvar.");return}const all=store.get("ah_notes",{});(all[rc]=all[rc]||[]).unshift({t:v,ts:Date.now()});store.set("ah_notes",all);openRequest(rc,null,"notas");return}
  if(has("data-delnote")){const [rc,i]=g("data-delnote").split(":"),all=store.get("ah_notes",{});(all[rc]||[]).splice(+i,1);store.set("ah_notes",all);openRequest(rc,null,"notas");return}
  if(has("data-month")){const d=+g("data-month"),a=state.ag;if(d===0){a.y=TODAY.getFullYear();a.m=TODAY.getMonth()}else{const x=new Date(a.y,a.m+d,1);a.y=x.getFullYear();a.m=x.getMonth()}a.sel=null;PAGES.agenda.render();return}
  if(has("data-day")){state.ag.sel=g("data-day")||null;PAGES.agenda.render();return}
  if(has("data-close")){closePanel()}
});
function runSearch(box){
  if(!box)return;const id=box.getAttribute("data-search"),v=box.querySelector("input").value;state[id].q=v;
  if(id==="home")homeResults();else if(id==="rec")PAGES.recusas.render();else PAGES[FILLERS(id)].fill();
}
function runChat(){const i=document.getElementById("chatIn");if(!i)return;const v=i.value;i.value="";chatSend(v);i.focus()}
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.isComposing)return;
  const t=e.target;if(!t||t.tagName!=="INPUT")return;
  if(t.id==="chatIn"){e.preventDefault();runChat();return}
  const box=t.closest("[data-search]");if(box){e.preventDefault();runSearch(box)}
});
document.addEventListener("change",e=>{
  const t=e.target,sel=t.closest("[data-filters] select");
  if(sel){const id=sel.closest("[data-filters]").getAttribute("data-filters");state[id].f[sel.getAttribute("data-key")]=sel.value;PAGES[FILLERS(id)].render();const b=document.querySelector('[data-filters="'+id+'"] [data-key="'+sel.getAttribute("data-key")+'"]');if(b)b.focus();return}
  if(t.matches("[data-task]")){let d=doneIds();const id=t.getAttribute("data-task");d=t.checked?d.concat(id):d.filter(x=>x!==id);store.set("ah_done",d);toast(t.checked?"Pendência marcada como feita.":"Pendência reaberta.");PAGES.pendencias.render();renderNav(curRoute);return}
  if(t.matches("[data-pend]")){state.pend.filter=t.value;PAGES.pendencias.render();return}
  if(t.matches("[data-atv]")){state.atv.sys=t.value;PAGES.atividade.render();return}
  if(t.matches("[data-atvfav]")){state.atv.fav=t.checked;PAGES.atividade.render();return}
  if(t.matches("[data-meta]")){state.ind.meta=Math.max(1,Math.min(30,parseInt(t.value,10)||META_DEFAULT));PAGES.indicadores.render();const n=document.querySelector("[data-meta]");if(n)n.focus();return}
});
scrim.addEventListener("click",()=>{if(panel.classList.contains("open"))closePanel();else{document.body.classList.remove("navopen");scrim.classList.remove("on")}});
let gPending=false,gT;
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();cmd.hidden?cmdOpen():cmdClose();return}
  if(e.key==="Escape"){if(!cmd.hidden)cmdClose();else if(panel.classList.contains("open"))closePanel();else{document.body.classList.remove("navopen");scrim.classList.remove("on")}return}
  if(e.key==="Tab"&&panel.classList.contains("open")&&cmd.hidden){
    const f=[...panel.querySelectorAll("button:not([disabled]),[href],input,select,textarea")].filter(x=>x.offsetParent!==null);if(!f.length)return;
    const a=f[0],b=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}
    return;
  }
  const tg=e.target,typing=tg&&(/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable);
  if(typing||e.ctrlKey||e.metaKey||e.altKey||!cmd.hidden)return;
  if(e.key==="/"){e.preventDefault();openChat(document.activeElement);return}
  if(e.key==="?"){e.preventDefault();openHelp(document.activeElement);return}
  if(gPending){gPending=false;clearTimeout(gT);const r=ROUTES.find(x=>x.key===e.key.toLowerCase());if(r){e.preventDefault();if(panel.classList.contains("open"))closePanel();go(r.id)}return}
  if(e.key.toLowerCase()==="g"){gPending=true;gT=setTimeout(()=>gPending=false,1200)}
});
const menuBtn=document.getElementById("menuBtn");
menuBtn.addEventListener("click",()=>{
  if(matchMedia("(max-width:820px)").matches){const o=document.body.classList.toggle("navopen");scrim.classList.toggle("on",o);menuBtn.setAttribute("aria-expanded",o)}
  else{const c=document.body.classList.toggle("collapsed");menuBtn.setAttribute("aria-expanded",!c)}
});
document.getElementById("themeBtn").addEventListener("click",()=>{
  const root=document.documentElement,dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  root.dataset.theme=dark?"light":"dark";store.set("ah_theme",root.dataset.theme);
});
const savedTheme=store.get("ah_theme",null);if(savedTheme)document.documentElement.dataset.theme=savedTheme;

/* =============== Roteamento =============== */
function go(id){if(location.hash==="#"+id)route();else location.hash="#"+id}
let first=true;
function route(){
  let id=(location.hash||"").replace("#","");
  if(!ROUTES.some(r=>r.id===id))id="visao-geral";
  curRoute=id;renderNav(id);
  document.body.classList.remove("navopen");
  if(!panel.classList.contains("open"))scrim.classList.remove("on");
  PAGES[id].render();
  const r=ROUTES.find(x=>x.id===id);
  document.title=(id==="visao-geral"?"":r.label+", ")+"Alpacas Hub";
  window.scrollTo(0,0);
  if(!first)view.focus({preventScroll:true});
  first=false;
}
window.addEventListener("hashchange",route);
route();
})();
